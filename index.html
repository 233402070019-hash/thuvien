<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện Trường học</title>
<style>
:root{--b:#1d5fd1;--bd:#134aa8;--bl:#eaf2ff;--t:#1c2733;--m:#64748b;--l:#dbe4f0;--bg:#f5f8fd;--w:#fff;--r:#d33;--g:#18a058;--o:#e08a00}
@media(prefers-color-scheme:dark){:root{--t:#e6edf7;--m:#94a3b8;--l:#2a3a52;--bg:#0f1826;--w:#172336;--bl:#1b2d4a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3{margin:.3em 0}h2{font-size:1.15rem;margin:1.2em 0 .6em}.muted,small{color:var(--m)}
.btn,button{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}.btn:hover,button:hover{background:var(--bd)}
button.s{background:var(--bl);color:var(--b)}button.d{background:var(--r)}button.g{background:var(--g)}button.sm{padding:4px 10px;font-size:13px;margin:1px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--l);border-radius:8px;background:var(--w);color:var(--t);font:inherit}
label{display:block;margin:10px 0 0;font-size:13px;color:var(--m)}label input[type=checkbox]{width:auto}
.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1d5fd1,#6aa6ff);padding:16px}
.card{background:var(--w);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:0 10px 40px #0003}.card.c{text-align:center}
.logo{font-size:56px}.err{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.top{background:var(--b);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:10px 20px;position:sticky;top:0;z-index:5}
.top a,.side a{color:inherit;text-decoration:none;padding:6px 10px;border-radius:8px;cursor:pointer}.top a.on,.top a:hover{background:#fff3}
.top .sp{flex:1}main{padding:20px;max-width:1150px;margin:auto}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--bd);color:#fff;padding:14px 10px;overflow:auto}.side a{display:block;margin:2px 0}.side a.on,.side a:hover{background:#fff3}
.adm main{margin-left:220px;max-width:none}.mb{display:none}
@media(max-width:800px){.side{position:static;width:auto;display:none;padding:8px}.side.open{display:block}.adm main{margin:0}.mb{display:block;background:var(--bd);padding:10px;color:#fff}}
.hero{background:linear-gradient(120deg,var(--b),#5b9dff);color:#fff;border-radius:16px;padding:26px}.hero h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.bk{background:var(--w);border:1px solid var(--l);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.bk:hover{transform:translateY(-3px);box-shadow:0 6px 18px #1d5fd133}
.cv{height:150px;display:grid;place-items:center;color:#fff;font-size:46px;font-weight:700;background-size:cover;background-position:center}.bk div.i{padding:10px}.bk b{display:block;line-height:1.3}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bl);color:var(--b)}.tag.ok{background:#18a05820;color:var(--g)}.tag.no{background:#d3333320;color:var(--r)}.tag.wa{background:#e08a0025;color:var(--o)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar>*{flex:1;min-width:160px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.st{background:var(--w);border-radius:12px;padding:16px;border-left:5px solid var(--b)}.st b{font-size:28px;display:block}
.tw{overflow-x:auto;background:var(--w);border-radius:12px;border:1px solid var(--l)}table{border-collapse:collapse;width:100%}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--l);white-space:nowrap}th{background:var(--bl);font-size:13px}
.ann{background:var(--w);border-left:4px solid var(--b);padding:10px 14px;border-radius:8px;margin:8px 0}.ann p{margin:4px 0 0}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}.box{background:var(--w);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}.hb span:first-child{width:140px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb i{display:block;height:16px;background:var(--b);border-radius:4px}
.col{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}.col div{flex:1;text-align:center;font-size:12px}.col i{display:block;background:var(--b);border-radius:6px 6px 0 0;margin-bottom:4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50}#toast div{background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;margin-top:6px;box-shadow:0 4px 14px #0004}#toast .e{background:var(--r)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n||0).toLocaleString('vi-VN')+'đ',vd=s=>s?s.split('-').reverse().join('/'):'—';
let U=null;
async function api(a,d={}){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok){if(r.status==401&&U&&a!='login'){U=null;route()}throw new Error(j.error||'Lỗi')}return j}
function toast(m,e){const t=document.createElement('div');t.textContent=m;if(e)t.className='e';$('#toast').append(t);setTimeout(()=>t.remove(),3200)}
const run=async(f,ok)=>{try{await f();if(ok)toast(ok);route()}catch(e){toast(e.message,1)}};
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="box">${h}</div>`;o.onclick=e=>{if(e.target==o)o.remove()};document.body.append(o);return o}
function fm(title,F,v,ok){const m=modal(`<h3>${title}</h3><form id="f">${F.map(([n,l,t,o])=>`<label>${l}${t=='textarea'?`<textarea name="${n}" rows="3">${esc(v[n])}</textarea>`:t=='select'?`<select name="${n}">${o.map(([a,b])=>`<option value="${a}" ${a==v[n]?'selected':''}>${esc(b)}</option>`).join('')}</select>`:t=='check'?` <input type="checkbox" name="${n}" ${v[n]?'checked':''}>`:`<input name="${n}" type="${t||'text'}" value="${t=='password'?'':esc(v[n])}">`}</label>`).join('')}<div class="err" id="fe"></div><div class="row"><button type="button" class="s" onclick="this.closest('.ov').remove()">Hủy</button><button>Lưu</button></div></form>`);
 $('#f').onsubmit=async e=>{e.preventDefault();const d={};for(const[n,,t]of F){const i=e.target[n];d[n]=t=='check'?+i.checked:i.value}try{await ok(d);m.remove();route();toast('Đã lưu')}catch(x){$('#fe').textContent=x.message}}}
const ask=(m,f)=>{if(confirm(m))run(f,'Đã thực hiện')};
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="muted">Không có dữ liệu.</td></tr>`}</table></div>`;
const ST={'Chờ duyệt':'wa','Đã duyệt':'','Đang mượn':'','Đã trả':'ok','Từ chối':'no','Đã hủy':'no'};
const stag=l=>`<span class="tag ${l.late?'no':ST[l.status]}">${l.late?'Quá hạn '+l.late+' ngày':l.status}</span>`;
const cover=b=>b.cover?`<div class="cv" style="background-image:url('${esc(b.cover)}')"></div>`:`<div class="cv" style="background:linear-gradient(135deg,hsl(${200+b.id*17%40},75%,42%),hsl(${215+b.id*11%30},80%,62%))">${esc(b.title[0])}</div>`;
const card=b=>`<div class="bk" onclick="detail(${b.id})">${cover(b)}<div class="i"><b>${esc(b.title)}</b><small>${esc(b.author)}</small><br><span class="tag">${esc(b.cat||'Khác')}</span> <span class="tag ${b.avail>0?'ok':'no'}">${b.avail>0?'Còn '+b.avail:'Hết sách'}</span></div></div>`;
async function detail(id){const{book:b}=await api('book',{id});const m=modal(`<div class="cv" style="height:200px;border-radius:10px;${b.cover?`background-image:url('${esc(b.cover)}')`:''}">${b.cover?'':esc(b.title[0])}</div><h3>${esc(b.title)}</h3><p>Tác giả: <b>${esc(b.author)}</b><br>Mã sách: ${esc(b.code)} · Thể loại: ${esc(b.cat||'Khác')}<br>Còn lại: <b>${b.avail}</b>/${b.qty} cuốn</p><p>${esc(b.descr)}</p><div class="row"><button class="s" onclick="this.closest('.ov').remove()">Đóng</button>${U.role=='student'?`<button id="bm" ${b.avail<1?'disabled':''}>Đăng ký mượn</button>`:''}</div>`);
 if($('#bm'))$('#bm').onclick=()=>run(async()=>{await api('request_loan',{book_id:id});m.remove()},'Đã gửi yêu cầu mượn, chờ thủ thư duyệt')}

/* ---------- đăng nhập / đăng ký ---------- */
function auth(h){const f=(t,body,ft)=>`<div class="auth"><div class="card"><div class="logo" style="text-align:center">📚</div><h2 style="text-align:center;margin-top:0">${t}</h2><form id="af">${body}<div class="err" id="ae"></div><button style="width:100%">${ft}</button></form><p style="text-align:center">${h=='login'?`<a href="#forgot">Quên mật khẩu?</a><br>Chưa có tài khoản? <a href="#register">Đăng ký ngay</a>`:`<a href="#login">← Về đăng nhập</a>`}</p></div></div>`;
 const inp=(n,l,t='text')=>`<label>${l}<input name="${n}" type="${t}"></label>`,sub=(a,ok,after)=>$('#af').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await api(a,d);ok&&toast(ok);after(r)}catch(x){$('#ae').textContent=x.message}};
 const A=$('#app');
 if(h=='login'){A.innerHTML=f('Đăng nhập',inp('username','Tên đăng nhập hoặc mã sinh viên')+`<label>Mật khẩu<div class="row"><input name="password" id="pw" type="password"><button type="button" class="s" onclick="pw.type=pw.type=='password'?'text':'password'">👁</button></div></label>`,'Đăng nhập');sub('login',0,async()=>{await start()})}
 else if(h=='register'){A.innerHTML=f('Đăng ký tài khoản',inp('full_name','Họ và tên')+inp('student_code','Mã sinh viên')+inp('class','Lớp')+inp('email','Email','email')+inp('phone','Số điện thoại')+inp('username','Tên đăng nhập')+inp('password','Mật khẩu','password')+inp('password2','Xác nhận mật khẩu','password'),'Tạo tài khoản');sub('register','Đăng ký thành công! Hãy đăng nhập.',()=>go('login'))}
 else if(h=='forgot'){A.innerHTML=f('Quên mật khẩu',inp('username','Tên đăng nhập')+inp('email','Email đã đăng ký','email')+inp('password','Mật khẩu mới','password'),'Đặt lại mật khẩu');sub('forgot','Đã đổi mật khẩu.',()=>go('login'))}
 else A.innerHTML=`<div class="auth"><div class="card c"><div class="logo">📚</div><h1>Thư viện Trường học</h1><p class="muted">Tra cứu, mượn và quản lý sách trực tuyến</p><div class="row"><button onclick="go('login')">Đăng nhập</button><button class="s" onclick="go('register')">Đăng ký tài khoản</button></div></div></div>`}
const go=h=>{location.hash=h};

/* ---------- khung + định tuyến ---------- */
const NS=[['home','Trang chủ'],['search','Tìm sách'],['mine','Yêu cầu & đang mượn'],['history','Lịch sử'],['profile','Cá nhân']],
NA=[['dash','📊 Dashboard'],['books','📖 Quản lý sách'],['cats','🗂 Danh mục'],['users','👥 Độc giả'],['loans','📝 Phiếu mượn'],['fines','⏰ Quá hạn & phạt'],['anns','📢 Thông báo'],['report','📈 Báo cáo']];
async function start(){try{U=(await api('me')).user}catch{U=null}route()}
async function route(){const h=location.hash.slice(1);if(!U)return auth(h);const adm=U.role=='admin',nav=adm?NA:NS,p=nav.some(n=>n[0]==h)?h:nav[0][0];
 const links=nav.map(n=>`<a class="${n[0]==p?'on':''}" href="#${n[0]}">${n[1]}</a>`).join(''),out=`<a onclick="logout()">Đăng xuất</a>`;
 $('#app').innerHTML=adm?`<div class="adm"><div class="mb" onclick="$('.side').classList.toggle('open')">☰ Thư viện – Quản trị</div><aside class="side"><h3>📚 Thư viện</h3><small>${esc(U.full_name)} (Thủ thư)</small><div style="margin-top:10px">${links}${out}</div></aside><main id="main"></main></div>`:`<header class="top"><b>📚 Thư viện</b>${links}<span class="sp"></span><small>${esc(U.full_name)}</small>${out}</header><main id="main"></main>`;
 try{await(adm?AP:SP)[p]($('#main'))}catch(e){toast(e.message,1)}}
const logout=async()=>{await api('logout');U=null;go('login');route()};
window.onhashchange=route;

/* ---------- giao diện sinh viên ---------- */
const SP={};
SP.home=async el=>{const d=await api('home');el.innerHTML=`<div class="hero"><h1>Xin chào, ${esc(U.full_name)}!</h1><p>Tìm sách yêu thích và đăng ký mượn ngay.</p></div>${d.anns.length?'<h2>📢 Thông báo thư viện</h2>'+d.anns.map(a=>`<div class="ann"><b>${esc(a.title)}</b> <small>${vd(a.created.slice(0,10))}</small><p>${esc(a.body)}</p></div>`).join(''):''}<h2>🆕 Sách mới</h2><div class="grid">${d.new.map(card).join('')}</div><h2>⭐ Sách nổi bật</h2><div class="grid">${d.featured.map(card).join('')||'<p class="muted">Chưa có.</p>'}</div>`};
SP.search=async el=>{const{cats}=await api('cats');el.innerHTML=`<div class="bar"><input id="q" placeholder="Tìm theo tên, tác giả, thể loại hoặc mã sách..."><select id="cat"><option value="">Tất cả thể loại</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div id="res" class="grid"></div>`;
 const f=async()=>{const r=await api('books',{q:$('#q').value,cat:$('#cat').value});$('#res').innerHTML=r.books.map(card).join('')||'<p class="muted">Không tìm thấy sách phù hợp.</p>'};$('#q').oninput=f;$('#cat').onchange=f;f()};
SP.mine=async el=>{const L=(await api('my_loans')).loans,w=L.filter(l=>['Chờ duyệt','Đã duyệt'].includes(l.status)),b=L.filter(l=>l.status=='Đang mượn');
 el.innerHTML=`<h2>⏳ Yêu cầu đang xử lý</h2>`+tbl(['Mã','Sách','Ngày gửi','Trạng thái',''],w.map(l=>[l.code,esc(l.title),vd(l.req_date),stag(l)+(l.status=='Đã duyệt'?' <small>– đến thư viện nhận sách</small>':''),l.status=='Chờ duyệt'?`<button class="sm d" onclick="ask('Hủy yêu cầu này?',()=>api('cancel_loan',{id:${l.id}}))">Hủy</button>`:'']))+`<h2>📖 Sách đang mượn</h2>`+tbl(['Mã','Sách','Ngày mượn','Hạn trả','Tình trạng','Phạt tạm tính'],b.map(l=>[l.code,esc(l.title),vd(l.borrow_date),vd(l.due_date),l.late?stag(l):'<span class="tag ok">Còn hạn</span>',l.late?money(l.fine_now):'—']))};
SP.history=async el=>{const L=(await api('my_loans')).loans.filter(l=>['Đã trả','Từ chối','Đã hủy'].includes(l.status));el.innerHTML='<h2>🕘 Lịch sử mượn trả</h2>'+tbl(['Sách','Ngày gửi','Ngày mượn','Ngày trả','Trạng thái','Tiền phạt'],L.map(l=>[esc(l.title),vd(l.req_date),vd(l.borrow_date),vd(l.return_date),stag(l),l.fine?money(l.fine)+(l.fine_paid?' (đã nộp)':' (chưa nộp)'):'—']))};
SP.profile=async el=>{el.innerHTML=`<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div class="card" style="max-width:none"><h3>Thông tin cá nhân</h3><p class="muted">Tên đăng nhập: ${esc(U.username)} · Mã SV: ${esc(U.student_code)}</p><form id="pf">${[['full_name','Họ và tên'],['class','Lớp'],['email','Email'],['phone','Số điện thoại']].map(([n,l])=>`<label>${l}<input name="${n}" value="${esc(U[n])}"></label>`).join('')}<div class="err" id="pe"></div><button>Lưu thay đổi</button></form></div>
<div class="card" style="max-width:none"><h3>Đổi mật khẩu</h3><form id="cf"><label>Mật khẩu hiện tại<input name="old" type="password"></label><label>Mật khẩu mới<input name="new" type="password"></label><div class="err" id="ce"></div><button>Đổi mật khẩu</button></form></div></div>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();try{await api('profile',Object.fromEntries(new FormData(e.target)));U=(await api('me')).user;toast('Đã cập nhật');$('#pe').textContent=''}catch(x){$('#pe').textContent=x.message}};
 $('#cf').onsubmit=async e=>{e.preventDefault();try{await api('change_pw',Object.fromEntries(new FormData(e.target)));toast('Đã đổi mật khẩu');e.target.reset();$('#ce').textContent=''}catch(x){$('#ce').textContent=x.message}}};

/* ---------- giao diện thủ thư ---------- */
const AP={};let CACHE={};
const bars=(it)=>{const mx=Math.max(1,...it.map(x=>x[1]));return it.map(x=>`<div class="hb"><span title="${esc(x[0])}">${esc(x[0])}</span><i style="width:${x[1]/mx*60}%"></i><b>${x[1]}</b></div>`).join('')||'<p class="muted">Chưa có dữ liệu.</p>'};
const lact=l=>({'Chờ duyệt':`<button class="sm g" onclick="la(${l.id},'approve')">Duyệt</button><button class="sm d" onclick="la(${l.id},'reject')">Từ chối</button>`,'Đã duyệt':`<button class="sm" onclick="la(${l.id},'give')">Giao sách</button>`,'Đang mượn':`<button class="sm g" onclick="la(${l.id},'return')">Nhận trả</button>`}[l.status]||'');
const la=(id,a)=>run(()=>api('a_loan_act',{id,act:a}),'Đã cập nhật phiếu');
const ltb=L=>tbl(['#','Độc giả','Sách','Ngày gửi','Hạn trả','Trạng thái',''],L.map(l=>[l.id,esc(l.full_name)+' <small>'+esc(l.student_code||'')+'</small>',esc(l.title),vd(l.req_date),vd(l.due_date),stag(l),lact(l)]));
AP.dash=async el=>{const s=await api('a_stats'),L=(await api('a_loans',{status:'Chờ duyệt'})).loans;el.innerHTML=`<h2 style="margin-top:0">Tổng quan</h2><div class="cards">${[['Đầu sách',s.titles,s.copies+' cuốn'],['Độc giả',s.readers,''],['Đang mượn',s.borrowing,s.overdue+' quá hạn'],['Phiếu chờ duyệt',s.pending,'']].map(x=>`<div class="st"><small>${x[0]}</small><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><h2>Phiếu chờ duyệt</h2>`+ltb(L)};
AP.books=async el=>{el.innerHTML=`<div class="bar"><input id="q" placeholder="Tìm sách theo tên, tác giả, mã, thể loại..."><button style="flex:none" onclick="bookForm()">+ Thêm sách</button></div><div id="bt"></div>`;
 const f=async()=>{const r=await api('books',{q:$('#q').value});CACHE.books=r.books;$('#bt').innerHTML=tbl(['Mã','Tên sách','Tác giả','Thể loại','SL','Còn','Nổi bật',''],r.books.map(b=>[b.code,esc(b.title),esc(b.author),esc(b.cat||''),b.qty,b.avail,b.featured?'⭐':'',`<button class="sm s" onclick="bookForm(${b.id})">Sửa</button><button class="sm d" onclick="ask('Xóa sách này?',()=>api('a_book_del',{id:${b.id}}))">Xóa</button>`]))};$('#q').oninput=f;f()};
async function bookForm(id){const{cats}=await api('cats'),b=(CACHE.books||[]).find(x=>x.id==id)||{qty:1};fm(id?'Sửa sách':'Thêm sách',[['code','Mã sách *'],['title','Tên sách *'],['author','Tác giả *'],['cat_id','Thể loại','select',[['','— Khác —'],...cats.map(c=>[c.id,c.name])]],['qty','Số lượng *','number'],['cover','Link ảnh bìa (tùy chọn)'],['descr','Mô tả','textarea'],['featured','Sách nổi bật','check']],b,d=>api('a_book_save',{...d,id}))}
AP.cats=async el=>{const{cats}=await api('cats');el.innerHTML=`<div class="bar"><button style="flex:none" onclick="catForm()">+ Thêm danh mục</button></div>`+tbl(['Tên danh mục','Số đầu sách',''],cats.map(c=>[esc(c.name),c.n,`<button class="sm s" onclick="catForm(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')">Sửa</button><button class="sm d" onclick="ask('Xóa danh mục?',()=>api('a_cat_del',{id:${c.id}}))">Xóa</button>`]))};
const catForm=(id,name)=>fm(id?'Sửa danh mục':'Thêm danh mục',[['name','Tên danh mục *']],{name},d=>api('a_cat_save',{...d,id}));
AP.users=async el=>{el.innerHTML=`<div class="bar"><input id="q" placeholder="Tìm độc giả..."><button style="flex:none" onclick="userForm()">+ Cấp tài khoản</button></div><div id="ut"></div>`;
 const f=async()=>{const r=await api('a_users',{q:$('#q').value});CACHE.users=r.users;$('#ut').innerHTML=tbl(['Họ tên','Tài khoản','Mã SV','Lớp','Email','SĐT','Vai trò','Đang mượn',''],r.users.map(x=>[esc(x.full_name),esc(x.username),esc(x.student_code||''),esc(x.class||''),esc(x.email),esc(x.phone||''),x.role=='admin'?'Thủ thư':'Sinh viên',x.borrowing,`<button class="sm s" onclick="userForm(${x.id})">Sửa</button><button class="sm s" onclick="ask('Đặt lại mật khẩu về 123456?',()=>api('a_user_reset',{id:${x.id}}))">Reset MK</button><button class="sm d" onclick="ask('Xóa tài khoản?',()=>api('a_user_del',{id:${x.id}}))">Xóa</button>`]))};$('#q').oninput=f;f()};
const userForm=id=>{const u=(CACHE.users||[]).find(x=>x.id==id)||{role:'student'};fm(id?'Sửa tài khoản':'Cấp tài khoản',[['full_name','Họ tên *'],['username','Tên đăng nhập *'],...(id?[]:[['password','Mật khẩu *','password']]),['student_code','Mã sinh viên'],['class','Lớp'],['email','Email *'],['phone','Số điện thoại'],['role','Vai trò','select',[['student','Sinh viên'],['admin','Thủ thư']]]],u,d=>api('a_user_save',{...d,id}))};
AP.loans=async el=>{const sel=sessionStorage.st||'';el.innerHTML=`<div class="bar"><select id="fs"><option value="">Tất cả trạng thái</option>${Object.keys(ST).map(s=>`<option ${s==sel?'selected':''}>${s}</option>`).join('')}</select></div>`+ltb((await api('a_loans',{status:sel})).loans);$('#fs').onchange=e=>{sessionStorage.st=e.target.value;route()}};
AP.fines=async el=>{const r=await api('a_fines');el.innerHTML=`<h2 style="margin-top:0">Sách quá hạn & tiền phạt</h2><p class="muted">Mức phạt: ${money(r.rate)}/ngày/cuốn.</p>`+tbl(['Độc giả','Sách','Hạn trả','Trễ','Tiền phạt','Trạng thái',''],r.loans.map(l=>[esc(l.full_name),esc(l.title),vd(l.due_date),l.late?l.late+' ngày':'—',money(l.fine_now),l.status=='Đang mượn'?'<span class="tag no">Chưa trả sách</span>':l.fine_paid?'<span class="tag ok">Đã nộp</span>':'<span class="tag wa">Chưa nộp</span>',l.status=='Đang mượn'?`<button class="sm g" onclick="la(${l.id},'return')">Nhận trả</button>`:!l.fine_paid?`<button class="sm" onclick="run(()=>api('a_fine_pay',{id:${l.id}}),'Đã thu tiền phạt')">Thu phạt</button>`:'']))};
AP.anns=async el=>{const{anns}=await api('a_anns');CACHE.anns=anns;el.innerHTML=`<div class="bar"><button style="flex:none" onclick="annForm()">+ Thêm thông báo</button></div>`+anns.map(a=>`<div class="ann"><b>${esc(a.title)}</b> <small>${vd(a.created.slice(0,10))}</small><p>${esc(a.body)}</p><button class="sm s" onclick="annForm(${a.id})">Sửa</button><button class="sm d" onclick="ask('Xóa thông báo?',()=>api('a_ann_del',{id:${a.id}}))">Xóa</button></div>`).join('');};
const annForm=id=>fm(id?'Sửa thông báo':'Thêm thông báo',[['title','Tiêu đề *'],['body','Nội dung *','textarea']],(CACHE.anns||[]).find(a=>a.id==id)||{},d=>api('a_ann_save',{...d,id}));
AP.report=async el=>{const r=await api('a_report'),mx=Math.max(1,...r.monthly.map(m=>m.n));el.innerHTML=`<h2 style="margin-top:0">Lượt mượn theo tháng</h2><div class="card" style="max-width:none"><div class="col">${r.monthly.map(m=>`<div><i style="height:${m.n/mx*140}px"></i><b>${m.n}</b><br>${m.m.slice(5)}/${m.m.slice(2,4)}</div>`).join('')||'<p class="muted">Chưa có dữ liệu.</p>'}</div></div><h2>Sách được mượn nhiều nhất</h2><div class="card" style="max-width:none">${bars(r.top.map(t=>[t.title,t.n]))}</div><h2>Phiếu theo trạng thái</h2><div class="card" style="max-width:none">${bars(r.by_status.map(t=>[t.status,t.n]))}</div>`};
start();
</script></body></html>
